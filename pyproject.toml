[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-agent"
version = "0.1.0"
description = "Codebase retrieval agent: Python AST index, FTS5 search, agent with path:line citations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
  "neo4j>=5.26.0",
  "pymysql[rsa]>=1.1.0",
  "orjson>=3.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 集成测试（MySQL 等外部服务）默认跳过；显式运行：pytest -m integration
addopts = "-m 'not integration'"
markers = [
  "integration: 需要外部服务（MySQL 等）的集成测试；默认跳过，用 -m integration 运行",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
